############################################################
# ESP Screens - Custom ESP32 D1 Mini (Doppio Bus SPI)
############################################################
esphome:
  min_version: 2026.6.2

packages:
  build: !include ../hardware/esp-idf.yaml
  flash: !include ../hardware/flash-4mb.yaml
  look: !include ../looks/compact.yaml
  touch: !include ../features/resistive-touch.yaml
  backlight: !include ../features/backlight.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  BOARD_ID: "custom_board"
  DEVICE_NAME: "pannello-verticale"
  DEVICE_FRIENDLY_NAME: "Pannello Verticale"
  BEDSIDE_OWN_DIGITS: "0"

  PANEL_W: "240"
  PANEL_H: "320"
  DISPLAY_DPI: "143"
  ROTATION_LANDSCAPE: "0"
  TOUCH_MIRROR_X: "true"
  GRID_COLS: "2"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  LVGL_BUFFER_SIZE: "12%"

  DISPLAY_MODEL: "ST7789V"
  DISPLAY_DATA_RATE: "40MHz"
  DISPLAY_INVERT_COLORS: "false"
  BACKLIGHT_FREQUENCY: "1000Hz"

  TOUCH_CAL_X_MIN: "280"
  TOUCH_CAL_X_MAX: "3860"
  TOUCH_CAL_Y_MIN: "340"
  TOUCH_CAL_Y_MAX: "3860"

esp32:
  board: esp32dev
  framework:
    advanced:
      sram1_as_iram: true
  variant: esp32

# Doppio Bus SPI separato (Display su VSPI hardware, Touch su SPI software)
spi:
  - id: lcd
    clk_pin: GPIO18
    mosi_pin: GPIO23

  - id: my_touchscreen
    clk_pin: GPIO4
    mosi_pin: GPIO13
    miso_pin: GPIO27

# Uscite PWM (Retroilluminazione su GPIO22 e Buzzer passivo su GPIO19)
output:
  - platform: ledc
    pin: GPIO22
    id: gpio_backlight_pwm
  - platform: ledc
    pin: GPIO19
    id: buzzer_output
    frequency: 2000Hz  # Frequenza iniziale del buzzer

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Retroilluminazione Display"
    id: display_light

script:
  - id: play_alert_sound
    mode: restart
    parameters:
      beep_count: int
      beep_freq: int
    then:
      - repeat:
          count: !lambda 'return beep_count;'
          then:
            # Imposta la frequenza e accende il buzzer
            - lambda: 'id(buzzer_output)->set_frequency(beep_freq);'
            - output.turn_on: buzzer_output
            - delay: 150ms
            - output.turn_off: buzzer_output
            - delay: 150ms
            
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Pulsante Toggle Luce"
    on_press:
      - light.toggle: display_light

  - platform: gpio
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Pulsante Pagina Successiva"
    on_press:
      # Inserisci qui l'azione per passare alla schermata successiva (es. display.page.next o comando LVGL)
      - logger.log: "Tasto premuto: Pagina Successiva"

  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Pulsante Pagina Precedente"
    on_press:
      # Inserisci qui l'azione per passare alla schermata precedente
      - logger.log: "Tasto premuto: Pagina Precedente"

button:
  - platform: template
    name: "Test Allarme Normale"
    on_press:
      - script.execute:
          id: play_alert_sound
          beep_count: 2
          beep_freq: 1500

  - platform: template
    name: "Test Allarme Critico"
    on_press:
      - script.execute:
          id: play_alert_sound
          beep_count: 10
          beep_freq: 2500

# Touchscreen XPT2046
touchscreen:
  - platform: xpt2046
    id: ts_touch
    spi_id: my_touchscreen
    cs_pin: 26
    interrupt_pin:
      number: GPIO25
    update_interval: 20ms
    threshold: 800

# Display ST7789V sul primo bus SPI
display:
  - platform: mipi_spi
    id: my_display
    spi_id: lcd
    model: ${DISPLAY_MODEL}
    data_rate: ${DISPLAY_DATA_RATE}
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO17
    invert_colors: ${DISPLAY_INVERT_COLORS}
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 240
      height: 320
